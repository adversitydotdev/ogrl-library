parameter_bindings:
  control--ogrl-ac-05:
    mfa_standard: "phishing-resistant (FIDO2/WebAuthn) or TOTP"
  control--ogrl-ac-13:
    identifier_reuse_period: at least two years
  control--ogrl-ac-18:
    external_system_review_frequency: annually
  control--ogrl-ac-19:
    public_content_removal_window: "24 hours"
    public_content_review_frequency: quarterly
  control--ogrl-cr-04:
    media_scope: >-
      paper media and laptops, workstations, mobile devices,
      removable media, and other devices that store CUI or
      organizational data
    sanitization_methods: >-
      NIST SP 800-88 clear, purge, or destroy techniques, including
      cryptographic erase of encrypted devices and cross-cut
      shredding or pulping of paper
  control--ogrl-gv-13:
    cmmc_assessment_frequency: annually
    cmmc_assessment_type: the CMMC Level 1 self-assessment
  control--ogrl-lm-02:
    triage_sla: "4 hours"
  control--ogrl-ps-01:
    access_review_cadence: quarterly
    controlled_facilities: >-
      all facilities where CUI is processed or stored, including
      offices, equipment rooms, and CUI media storage areas
  control--ogrl-ps-02:
    access_device_inventory_cadence: annually
    controlled_facilities: >-
      all facilities where CUI is processed or stored, including
      offices, equipment rooms, and CUI media storage areas
    entry_control_mechanism: >-
      electronic badge readers that log each entry, or keyed locks
      supplemented by a maintained entry log
    entry_log_retention: at least 1 year
  control--ogrl-ps-03:
    controlled_facilities: >-
      all facilities where CUI is processed or stored, including
      offices, equipment rooms, and CUI media storage areas
    visitor_record_retention: at least 1 year
    visitor_review_cadence: monthly
  control--ogrl-vm-02:
    patch_sla: >-
      14 days for critical, 30 days for high, and 90 days for other
      security updates
  control--ogrl-vm-03:
    malware_coverage_review_frequency: monthly
    malware_protected_assets: >-
      all endpoints and servers in the CMMC assessment scope running
      general-purpose operating systems
    malware_scan_frequency: weekly

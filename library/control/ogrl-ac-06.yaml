type: control
id: control--ogrl-ac-06
spec_version: "0.1.0"
created: "2026-11-20T00:00:00Z"
modified: "2026-11-20T00:00:00Z"
name: Secret and Authenticator Lifecycle Management
display_id: OGRL-AC-06
control_type: preventive
family: ac
frequency: quarterly
guidance: >
  Prefer short-lived workload identities (OIDC/IAM roles) over
  static API keys, run secret scanning on source repositories, and
  replace default credentials prior to deployment.
objective: >
  Protect authenticators from unauthorized disclosure and limit
  exposure windows if leaked.
origin: standard
parameters:
  revocation_triggers:
    label: Immediate revocation events
    value: >-
      suspected exposure, personnel departure, or system
      decommission
  rotation_period:
    label: Maximum static credential lifetime
    value: "90 days"
statement: >
  Manage passwords, API keys, and cryptographic credentials in an
  approved secrets vault, rotate non-ephemeral credentials at least
  every {{ rotation_period }}, and revoke immediately upon
  {{ revocation_triggers }}.
summary: >
  Store secrets in managed vaults, prohibit hardcoded credentials,
  and rotate keys on a defined cadence or upon compromise.
tags:
  - secrets
  - credentials
  - authentication

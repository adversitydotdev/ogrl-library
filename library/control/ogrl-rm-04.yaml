type: control
id: control--ogrl-rm-04
spec_version: "0.2.0"
created: "2026-11-21T00:00:00Z"
modified: "2026-11-21T00:00:00Z"
name: Risk Treatment Tracking
display_id: OGRL-RM-04
control_type: corrective
family: rm
frequency: quarterly
guidance: >
  Track treatment in the risk register or link register entries to
  tickets. Mitigation plans should reference the controls being
  added or strengthened; transfer should reference the contract or
  insurance policy. Evidence: register entries with decisions,
  approvals, and review dates.
objective: >
  Every risk outside tolerance has an accountable, tracked response
  consistent with leadership's risk appetite.
origin: standard
parameters:
  acceptance_duration:
    label: Maximum risk acceptance duration
    value: "12 months"
  risk_acceptance_authority:
    label: Risk acceptance authority
    value: the CEO for high risks and the security leader for others
  risk_tolerance_threshold:
    label: Risk tolerance threshold
    value: the tolerance level defined in the risk methodology
  treatment_review_frequency:
    label: Treatment review frequency
    value: quarterly
statement: >
  For each risk rated above {{ risk_tolerance_threshold }}, record a
  treatment decision (mitigate, transfer, avoid, or accept), an
  owner, and a target date. Risk acceptances require documented
  approval by {{ risk_acceptance_authority }} and expire after
  {{ acceptance_duration }}. Review treatment progress and
  acceptances {{ treatment_review_frequency }}.
summary: >
  Record a treatment decision, owner, and target date for each risk
  above tolerance, with approved and time-bound risk acceptances.
tags:
  - risk-management
  - risk-treatment

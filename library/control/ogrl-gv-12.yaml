type: control
id: control--ogrl-gv-12
spec_version: "0.1.0"
created: "2026-11-21T00:00:00Z"
modified: "2026-11-21T00:00:00Z"
name: Deficiency Tracking and Remediation
display_id: OGRL-GV-12
control_type: corrective
family: gv
frequency: monthly
guidance: >
  A dedicated project in the ticketing system or the compliance platform's
  findings module works as the register. Close items only with evidence of the
  fix and, for significant deficiencies, a retest. Evidence: the register with
  timestamps and the review meeting notes.
objective: >
  Identified control weaknesses are communicated to those who can fix them and
  are corrected in a timely, tracked way.
origin: standard
parameters:
  remediation_sla:
    label: Deficiency remediation deadline
    value: >
      30 days for high severity and 90 days for others, unless a documented risk
      acceptance applies
  review_audience:
    label: Deficiency review audience
    value: the security leader and responsible control owners
  review_frequency:
    label: Deficiency review frequency
    value: monthly
statement: >
  Record every control deficiency identified by assessments, audits,
  continuous monitoring, penetration tests, or incidents in a deficiency
  register with an owner, severity, remediation plan, and due date. Remediate
  deficiencies within {{ remediation_sla }}, review open and overdue items
  with {{ review_audience }} {{ review_frequency }}, and escalate items past
  due to executive leadership.
summary: >
  Track every control deficiency to remediation with an owner and due date,
  and review open items with leadership.
tags:
  - governance
  - deficiency-management
  - remediation

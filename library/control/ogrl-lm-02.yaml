type: control
id: control--ogrl-lm-02
spec_version: "0.2.0"
created: "2026-11-20T00:00:00Z"
modified: "2026-11-20T00:00:00Z"
name: Continuous Security Monitoring and Alert Triage
display_id: OGRL-LM-02
control_type: detective
family: lm
frequency: continuous
guidance: >
  Tune SIEM/EDR rules to minimize alert fatigue, document escalation
  runbooks, and test alerting pipelines periodically.
objective: >
  Detect unauthorized activity, intrusion attempts, and security
  anomalies quickly enough to contain impact.
origin: standard
parameters:
  alert_recipients:
    label: Alert response recipients
    value: the on-call security operations team
  monitoring_methods:
    label: Detection techniques and tools
    value: >-
      automated SIEM correlation rules and cloud threat detection
  monitoring_objectives:
    label: Security monitoring objectives
    value: >
      unauthorized access, privilege escalation, malware execution,
      and anomalous data egress
  triage_sla:
    label: High-severity alert triage SLA
    value: "4 hours"
statement: >
  Continuously monitor system and security telemetry using
  {{ monitoring_methods }} to detect {{ monitoring_objectives }},
  routing actionable alerts to {{ alert_recipients }} for triage
  within {{ triage_sla }}.
summary: >
  Monitor telemetry continuously for anomalous behavior and route
  high-severity security alerts for timely triage.
tags:
  - monitoring
  - siem
  - detection

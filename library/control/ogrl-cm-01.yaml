type: control
id: control--ogrl-cm-01
spec_version: "0.1.0"
created: "2026-11-20T00:00:00Z"
modified: "2026-11-20T00:00:00Z"
name: Peer-Reviewed Production Change Control
display_id: OGRL-CM-01
control_type: preventive
family: cm
frequency: event-driven
guidance: >
  Enforce branch protection rules that prevent self-approval,
  require passing CI checks, and link deployments to immutable
  commit hashes and review tickets.
objective: >
  Prevent unauthorized, untested, or unreviewed modifications to
  production code and infrastructure.
origin: standard
parameters:
  change_authority:
    label: Change oversight authority
    value: designated code owners and the change advisory workflow
  change_record_retention:
    label: Change record retention period
    value: "365 days"
statement: >
  Require independent peer review, automated verification checks,
  and documented approval overseen by {{ change_authority }} before
  merging or deploying changes to production, retaining change
  records for {{ change_record_retention }}.
summary: >
  Require independent peer review, automated testing, and traceable
  approval before deploying production code or infrastructure
  changes.
tags:
  - change-management
  - sdlc
  - ci-cd

type: control
id: control--ogrl-cm-07
spec_version: "0.1.0"
created: "2026-11-21T00:00:00Z"
modified: "2026-11-21T00:00:00Z"
name: Change Testing and Environment Separation
display_id: OGRL-CM-07
control_type: preventive
family: cm
frequency: event-driven
guidance: >
  Run staging in a separate cloud account or project with distinct
  credentials. Configure required status checks in branch protection so merges
  are blocked on failing tests, and keep CI run links on the pull request. Use
  synthetic or masked data sets for testing.
objective: >
  Catch defects and unintended effects before they reach production without
  exposing customer data in lower environments.
origin: standard
parameters:
  prod_data_exception_approver:
    label: Production data in test exception approver
    value: the security lead
  test_environment:
    label: Pre-production test environment
    value: a staging environment in a separate cloud account or project
statement: >
  Test and validate each change in {{ test_environment }} that is logically
  separated from production before deployment, require automated test suites
  to pass as a merge or deployment gate, retain test results with the change
  record, and prohibit unmasked production customer data in non-production
  environments unless approved by {{ prod_data_exception_approver }}.
summary: >
  Test changes in separated non-production environments with automated gates
  before production deployment.
tags:
  - change-management
  - testing
  - environment-separation

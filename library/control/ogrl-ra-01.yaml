type: control
id: control--ogrl-ra-01
spec_version: "0.1.0"
created: "2026-11-20T00:00:00Z"
modified: "2026-11-20T00:00:00Z"
name: Vulnerability Scanning and SLA-Driven Remediation
display_id: OGRL-RA-01
control_type: detective
family: Risk Assessment
frequency: weekly
guidance: >
  Combine authenticated infrastructure scanning with CI/CD
  dependency/container scanning and track open vulnerabilities in an issue
  tracker with explicit SLA due dates.
objective: >
  Identify and remediate exploitable software flaws and misconfigurations
  before adversaries leverage them.
origin: standard
parameters:
  advisory_audience:
    label: Internal advisory recipients
    value: engineering service owners and platform security leads
  remediation_sla:
    label: Vulnerability remediation SLA
    value: "15 days for critical and 30 days for high severity findings"
  scan_cadence:
    label: Vulnerability scanning frequency
    value: at least weekly and on every release
statement: >
  Scan in-scope infrastructure, container images, and application dependencies
  for vulnerabilities {{ scan_cadence }}, remediate confirmed findings within
  {{ remediation_sla }}, and share advisories with {{ advisory_audience }}.
summary: >
  Scan infrastructure, containers, and dependencies continuously for
  vulnerabilities and remediate findings within risk-based SLAs.
tags:
  - vulnerability-management
  - scanning
  - risk

type: control
id: control--ogrl-bc-06
spec_version: "0.1.0"
created: "2026-11-21T00:00:00Z"
modified: "2026-11-21T00:00:00Z"
name: System Recovery and Reconstitution
display_id: OGRL-BC-06
control_type: corrective
family: bc
frequency: event-driven
guidance: >
  Rebuild from infrastructure as code and trusted images rather than
  patching compromised hosts in place. Restore data from the most
  recent clean backup, which may predate the latest backup after
  ransomware or corruption. Use a recovery checklist that confirms
  logging, encryption, access policies, and monitoring are active
  before reopening traffic. Tighten the default objectives per
  service based on the business impact analysis (OGRL-BC-07).
  Evidence is the recovery record showing timing and the completed
  checklist.
objective: >
  Return systems to normal, secure operation within committed
  timeframes and without degrading the controls that protect them.
origin: standard
parameters:
  recovery_point_objective:
    label: Recovery point objective
    value: "24 hours"
  recovery_time_objective:
    label: Recovery time objective
    value: "24 hours"
statement: >
  After a disruption, compromise, or failure, recover affected
  systems to a known-good state within {{ recovery_time_objective }}
  and with data loss no greater than {{ recovery_point_objective }}
  using documented recovery runbooks and infrastructure as code, and
  verify that security configurations and controls are restored and
  functioning before returning systems to service.
summary: >
  Restore affected systems to a known-good, secure state within
  defined recovery time and recovery point objectives after a
  disruption.
tags:
  - disaster-recovery
  - reconstitution
  - resilience

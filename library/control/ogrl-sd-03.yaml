type: control
id: control--ogrl-sd-03
spec_version: "0.1.0"
created: "2026-11-21T00:00:00Z"
modified: "2026-11-21T00:00:00Z"
name: Static Analysis and Dependency Scanning
display_id: OGRL-SD-03
control_type: detective
family: sd
frequency: event-driven
guidance: >
  Use CI-integrated tools such as CodeQL or Semgrep, GitHub secret
  scanning with push protection, and Dependabot or Snyk, configured
  as required status checks. Track approved exceptions with an
  expiry date. Ongoing scanning of deployed images and dependencies
  is covered by OGRL-VM-01.
objective: >
  Prevent common code flaws, leaked secrets, and known-vulnerable
  dependencies from being merged.
origin: standard
parameters:
  blocking_severity:
    label: Minimum blocking severity
    value: high
  scan_exception_approver:
    label: Scan exception approver
    value: the security lead
  scanned_repositories:
    label: Repositories subject to scanning
    value: >-
      all repositories that build or deploy production code or
      infrastructure
statement: >
  Run static application security testing, secret scanning, and
  software composition analysis on every pull request to
  {{ scanned_repositories }}, block merge on unresolved findings
  rated {{ blocking_severity }} or above unless an exception is
  approved by {{ scan_exception_approver }}, and retain scan results
  with the change record.
summary: >
  Run SAST, secret scanning, and dependency analysis on every pull
  request and block merges on serious findings.
tags:
  - sast
  - dependency-scanning
  - ci-cd

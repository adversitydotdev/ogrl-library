type: control
id: control--ogrl-ac-02
spec_version: "0.1.0"
created: "2026-11-20T00:00:00Z"
modified: "2026-11-20T00:00:00Z"
name: Periodic User Access Review
display_id: OGRL-AC-02
control_type: detective
family: ac
frequency: quarterly
guidance: >
  Generate account rosters directly from authoritative identity providers and
  production systems, require reviewer sign-off from managers or system
  owners, and retain ticketed removal evidence.
objective: >
  Detect and remove privilege creep, orphaned accounts, and stale entitlements
  before misuse.
origin: standard
parameters:
  remediation_window:
    label: Revocation remediation window
    value: "5 business days"
  review_cadence:
    label: Access review cadence
    value: at least quarterly
statement: >
  Review all active user accounts, privileged roles, and service accounts
  {{ review_cadence }} and remediate unauthorized or unneeded entitlements
  within {{ remediation_window }}.
summary: >
  Review active user accounts and privileged group memberships on a defined
  cadence and revoke unapproved access.
tags:
  - access-review
  - governance
  - access-control

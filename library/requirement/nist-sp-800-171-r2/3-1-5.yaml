objectives:
  - id: a
    methods:
      - method: examine
        statement: >-
          Access control policy; procedures addressing account
          management; security plan; system design documentation;
          system configuration settings and associated
          documentation; list of active system accounts and the name
          of the individual associated with each account; list of
          conditions for group and role membership; notifications or
          records of recently transferred, separated, or terminated
          employees; list of recently disabled system accounts along
          with the name of the individual associated with each
          account; access authorization records; account management
          compliance reviews; system monitoring/audit records; other
          relevant documents or records; procedures addressing least
          privilege; list of security functions (deployed in
          hardware, software, and firmware) and security-relevant
          information for which access must be explicitly
          authorized; list of system-generated privileged accounts;
          list of system administration personnel
      - method: interview
        statement: >-
          Personnel with account management responsibilities; system
          or network administrators; personnel with information
          security responsibilities; personnel with responsibilities
          for defining least privileges necessary to accomplish
          specified tasks
      - method: test
        statement: >-
          Organizational processes for managing system accounts;
          mechanisms for implementing account management; mechanisms
          implementing least privilege functions; mechanisms
          prohibiting privileged access to the system
    statement: privileged accounts are identified.

objectives:
  - id: a
    methods:
      - method: examine
        statement: >-
          System and information integrity policy; procedures
          addressing flaw remediation; procedures addressing
          configuration management; security plan; list of flaws and
          vulnerabilities potentially affecting the system; list of
          recent security flaw remediation actions performed on the
          system (e.g., list of installed patches, service packs,
          hot fixes, and other software updates to correct system
          flaws); test results from the installation of software and
          firmware updates to correct system flaws;
          installation/change control records for security-relevant
          software and firmware updates; other relevant documents or
          records
      - method: interview
        statement: >-
          System or network administrators; personnel with
          information security responsibilities; personnel
          installing, configuring, and maintaining the system;
          personnel with responsibility for flaw remediation;
          personnel with configuration management responsibility
      - method: test
        statement: >-
          Organizational processes for identifying, reporting, and
          correcting system flaws; organizational process for
          installing software and firmware updates; mechanisms
          supporting or implementing reporting, and correcting
          system flaws; mechanisms supporting or implementing
          testing software and firmware updates
    statement: >-
      the time within which to identify system flaws is specified.

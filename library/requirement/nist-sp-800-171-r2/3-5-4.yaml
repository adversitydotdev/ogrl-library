objectives:
  - id: a
    methods:
      - method: examine
        statement: >-
          Identification and authentication policy; procedures
          addressing user identification and authentication;
          security plan; system design documentation; system
          configuration settings and associated documentation;
          system audit logs and records; list of privileged system
          accounts; other relevant documents or records
      - method: interview
        statement: >-
          Personnel with system operations responsibilities;
          personnel with account management responsibilities;
          personnel with information security responsibilities;
          system or network administrators; system developers
      - method: test
        statement: >-
          Mechanisms supporting or implementing identification and
          authentication capability or replay resistant
          authentication mechanisms
    statement: >-
      replay-resistant authentication mechanisms are implemented for
      network account access to privileged and non-privileged
      accounts.
statement: >-
  Employ replay-resistant authentication mechanisms for network
  access to privileged and non-privileged accounts.

    methods:
      - method: examine
        statement: >-
          Identification and authentication policy; password policy;
          procedures addressing authenticator management; security
          plan; system design documentation; system configuration
          settings and associated documentation; password
          configurations and associated documentation; other
          relevant documents or records
      - method: interview
        statement: >-
          Personnel with authenticator management responsibilities;
          personnel with information security responsibilities;
          system or network administrators; system developers
      - method: test
        statement: >-
          Mechanisms supporting or implementing password-based
          authenticator management capability
    statement: >-
      an immediate change to a permanent password is required when a

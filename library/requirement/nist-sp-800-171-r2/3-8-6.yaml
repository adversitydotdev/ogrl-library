    methods:
      - method: examine
        statement: >-
          System media protection policy; procedures addressing
          media transport; system design documentation; security
          plan; system configuration settings and associated
          documentation; system media transport records; system
          audit logs and records; other relevant documents or
          records
      - method: interview
        statement: >-
          Personnel with system media transport responsibilities;
          personnel with information security responsibilities
      - method: test
        statement: >-
          Cryptographic mechanisms protecting information on digital
          media during transportation outside controlled areas
    statement: >-
      the confidentiality of CUI stored on digital media is
      protected during transport using cryptographic mechanisms or
      alternative physical safeguards.
statement: >-
  Implement cryptographic mechanisms to protect the confidentiality
  of CUI stored on digital media during transport unless otherwise
  protected by alternative physical safeguards.

parts:
  - id: a
    statement: >-
      Enforce physical access authorizations at entry and exit
      points to the facility where the system resides by:
  - id: a.01
    statement: >-
      Verifying individual physical access authorizations before
      granting access to the facility and
  - id: a.02
    statement: >-
      Controlling ingress and egress with physical access control
      systems, devices, or guards.

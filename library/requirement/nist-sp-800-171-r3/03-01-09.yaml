    methods:
      - method: examine
        statement: >
          access control policy and procedures; privacy and security policies,
          procedures for system use notification; documented approval of system use
          notification messages; system audit records; user acknowledgements of system
          use notification messages; system design documentation; system configuration
          settings; system use notification messages; system security plan; other
          relevant documents or records
      - method: interview
        statement: >

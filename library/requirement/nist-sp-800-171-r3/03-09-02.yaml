parts:
  - id: a
    statement: "When individual employment is terminated:"
  - id: a.01
    statement: >-
      Disable system access within {{ a_03_09_02_odp_01 }},
  - id: a.02
    statement: >-
      Terminate or revoke authenticators and credentials associated
      with the individual, and
  - id: a.03
    statement: Retrieve security-related system property.
  - id: b
    statement: >-
      When individuals are reassigned or transferred to other
      positions in the organization:
  - id: b.01
    statement: >-
      Review and confirm the ongoing operational need for current
      logical and physical access authorizations to the system and
      facility, and
  - id: b.02
    statement: >-
      Modify access authorization to correspond with any changes in
      operational need.

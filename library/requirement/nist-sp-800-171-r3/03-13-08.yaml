          system administrators
      - method: test
        statement: >
          mechanisms for supporting or implementing transmission confidentiality;
          cryptographic mechanisms for supporting or implementing transmission
          confidentiality; mechanisms for supporting or implementing confidentiality
          protection for information in storage; cryptographic mechanisms for
          implementing confidentiality protections for information in storage
    statement: >
      cryptographic mechanisms are implemented to prevent the unauthorized

parts:
  - id: a
    statement: >
      Maintain a list of commonly-used, expected, or compromised
      passwords, and update the list {{ a_03_05_07_odp_01 }} and
      when organizational passwords are suspected to have been
      compromised.
  - id: b
    statement: >
      Verify that passwords are not found on the list of commonly
      used, expected, or compromised passwords when users create or
      update passwords.
  - id: c
    statement: >-

parts:
  - id: a
    statement: >
      Develop a plan for managing supply chain risks associated with the research
      and development, design, manufacturing, acquisition, delivery, integration,
      operations, maintenance, and disposal of the system, system components, or
      system services.
  - id: b
    statement: "Review and update the supply chain risk management plan {{ a_03_17_01_odp_01 }}."
  - id: c
    statement: Protect the supply chain risk management plan from unauthorized disclosure.

  - id: a.01
    methods:
      - method: examine
        statement: >
          SCRM policy and procedures; SCRM plan; system and services acquisition
          policy and procedures; system and services acquisition procedures;
          procedures for supply chain protection; procedures for protecting the SCRM
          plan from unauthorized disclosure; system development life cycle procedures;
          procedures for the integration of information security requirements into the
          acquisition process; acquisition documentation; service-level agreements;
          acquisition contracts for the system, system components, or system services;
          list of supply chain threats; list of safeguards for supply chain threats;
          system life cycle documentation, including research and development, design,
          manufacturing, acquisition, delivery, integration, operations, maintenance,
          and disposal; inter-organizational agreements and procedures; system
          security plan; other relevant documents or records
      - method: interview
        statement: >
          personnel with acquisition responsibilities; personnel with SCRM
          responsibilities; personnel with information security responsibilities
      - method: test
        statement: >
          organizational processes for defining and documenting the system development
          life cycle (SDLC); organizational processes for identifying SDLC roles and
          responsibilities; organizational processes for integrating SCRM into the
          SDLC; mechanisms for supporting or implementing the SDLC
    statement: a plan for managing supply chain risks is developed.

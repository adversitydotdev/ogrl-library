parts:
  - id: a
    statement: >-
      Define the types of changes to the system that are
      configuration-controlled.
  - id: b
    statement: >-
      Review proposed configuration-controlled changes to the
      system, and approve or disapprove such changes with explicit
      consideration for security impacts.
  - id: c
    statement: >-
      Implement and document approved configuration-controlled
      changes to the system.
  - id: d
    statement: >-
      Monitor and review activities associated with
      configuration-controlled changes to the system.

parts:
  - id: a
    statement: >-
      Establish usage restrictions, configuration requirements, and
      connection requirements for each type of wireless access to
      the system.
  - id: b
    statement: >-
      Authorize each type of wireless access to the system prior to
      establishing such connections.
  - id: c
    statement: >-
      Disable, when not intended for use, wireless networking
      capabilities prior to issuance and deployment.
  - id: d
    statement: >-
      Protect wireless access to the system using authentication and
      encryption.

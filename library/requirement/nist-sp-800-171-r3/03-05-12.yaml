  - id: a
    methods:
      - method: examine
        statement: >
          identification and authentication policy and procedures; procedures for
          authenticator management; system configuration settings; list of system
          authenticator types; system design documentation; system audit records;
          change control records associated with managing system authenticators;
          system security plan; other relevant documents or records
      - method: interview
        statement: >
          personnel with authenticator management responsibilities; personnel with
          information security responsibilities; system administrators
      - method: test
        statement: >
          mechanisms for supporting or implementing the authenticator management
          capability
    statement: >
      the identity of the individual, group, role, service, or device receiving

  - id: a.01.01
    methods:
      - method: examine
        statement: >-
          system and information integrity policy and procedures;
          procedures for system monitoring tools and techniques;
          continuous monitoring strategy; facility diagram or
          layout; system design documentation; locations within the
          system where monitoring devices are deployed; system
          configuration settings; system protocols; system audit
          records; system security plan; other relevant documents or
          records
      - method: interview
        statement: >-
          personnel with responsibilities for installing,
          configuring, or maintaining the system; personnel with
          system monitoring responsibilities; personnel with
          intrusion detection responsibilities; personnel with
          information security responsibilities; system
          administrators
      - method: test
        statement: >-

objectives:
  - id: a.1-1
    methods:
      - method: examine
        statement: >
          System and services acquisition policy; system and services acquisition
          procedures; procedures addressing system documentation; system
          documentation, including administrator and user guides; system design
          documentation; records documenting attempts to obtain unavailable or
          nonexistent system documentation; list of actions to be taken in response to
          documented attempts to obtain system, system component, or system service
          documentation; risk management strategy documentation; system security plan;
          privacy plan; privacy impact assessment; privacy risk assessment
          documentation; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with acquisition/contracting responsibilities;
          organizational personnel with information security and privacy
          responsibilities; system administrators; organizational personnel
          responsible for operating, using, and/or maintaining the system; system
          developers
      - method: test
        statement: >
          Organizational processes for obtaining, protecting, and distributing system
          administrator and user documentation
    statement: >
      administrator documentation for the system, system component, or system
      service that describes the secure configuration of the system, component, or
      service is obtained or developed;

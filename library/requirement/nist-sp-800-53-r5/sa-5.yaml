parts:
  - id: a
    statement: >
      Obtain or develop administrator documentation for the system, system
      component, or system service that describes:
  - id: a.1
    statement: >
      Secure configuration, installation, and operation of the system, component,
      or service;
  - id: a.2
    statement: >
      Effective use and maintenance of security and privacy functions and
      mechanisms; and
  - id: a.3
    statement: >
      Known vulnerabilities regarding configuration and use of administrative or
      privileged functions;
  - id: b
    statement: >
      Obtain or develop user documentation for the system, system component, or
      system service that describes:
  - id: b.1
    statement: >
      User-accessible security and privacy functions and mechanisms and how to
      effectively use those functions and mechanisms;
  - id: b.2
    statement: >
      Methods for user interaction, which enables individuals to use the system,
      component, or service in a more secure manner and protect individual
      privacy; and
  - id: b.3
    statement: >
      User responsibilities in maintaining the security of the system, component,
      or service and privacy of individuals;
  - id: c
    statement: >
      Document attempts to obtain system, system component, or system service
      documentation when such documentation is either unavailable or nonexistent
      and take {{ sa_05_odp_01 }} in response; and
  - id: d
    statement: "Distribute documentation to {{ sa_05_odp_02 }}."

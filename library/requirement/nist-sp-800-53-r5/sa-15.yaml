parts:
  - id: a
    statement: >-
      Require the developer of the system, system component, or
      system service to follow a documented development process
      that:
  - id: a.1
    statement: >-
      Explicitly addresses security and privacy requirements;
  - id: a.2
    statement: >-
      Identifies the standards and tools used in the development
      process;
  - id: a.3
    statement: >-
      Documents the specific tool options and tool configurations
      used in the development process; and
  - id: a.4
    statement: >-
      Documents, manages, and ensures the integrity of changes to
      the process and/or tools used in development; and
  - id: b
    statement: >-
      Review the development process, standards, tools, tool
      options, and tool configurations {{ sa_15_odp_01 }} to
      determine if the process, standards, tools, tool options and
      tool configurations selected and employed can satisfy the
      following security and privacy requirements:
      {{ sa_15_prm_2 }}.

  - id: sr-07
    methods:
      - method: examine
        statement: >
          Supply chain risk management plan; supply chain risk management procedures;
          system and services acquisition policy; system and services acquisition
          procedures; procedures addressing supply chain protection; list of OPSEC
          controls to be employed; solicitation documentation; acquisition
          documentation; acquisition contracts for the system, system component, or
          system service; records of all-source intelligence analyses; system security
          plan; privacy plan; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with acquisition responsibilities; organizational
          personnel with information security and privacy responsibilities;
          organizational personnel with OPSEC responsibilities; organizational

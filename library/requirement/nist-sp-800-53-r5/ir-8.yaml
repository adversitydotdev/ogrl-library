parts:
  - id: a
    statement: "Develop an incident response plan that:"
  - id: a.1
    statement: >-
      Provides the organization with a roadmap for implementing its
      incident response capability;
  - id: a.2
    statement: >-
      Describes the structure and organization of the incident
      response capability;
  - id: a.3
    statement: >-
      Provides a high-level approach for how the incident response
      capability fits into the overall organization;
  - id: a.4
    statement: >-
      Meets the unique requirements of the organization, which
      relate to mission, size, structure, and functions;
  - id: a.5
    statement: Defines reportable incidents;
  - id: a.6
    statement: >-
      Provides metrics for measuring the incident response
      capability within the organization;
  - id: a.7
    statement: >-
      Defines the resources and management support needed to
      effectively maintain and mature an incident response
      capability;
  - id: a.8
    statement: Addresses the sharing of incident information;
  - id: a.9
    statement: >-
      Is reviewed and approved by {{ ir_08_odp_01 }}
      {{ ir_08_odp_02 }} ; and
  - id: a.10
    statement: >-
      Explicitly designates responsibility for incident response to
      {{ ir_08_odp_03 }}.
  - id: b
    statement: >-
      Distribute copies of the incident response plan to
      {{ ir_08_odp_04 }};
  - id: c
    statement: >-
      Update the incident response plan to address system and
      organizational changes or problems encountered during plan
      implementation, execution, or testing;
  - id: d
    statement: >-
      Communicate incident response plan changes to {{ ir_8_prm_5 }}
      ; and
  - id: e
    statement: >-
      Protect the incident response plan from unauthorized
      disclosure and modification.

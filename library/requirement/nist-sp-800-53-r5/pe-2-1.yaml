objectives:
  - id: "pe-02(01)"
    methods:
      - method: examine
        statement: >-
          Physical and environmental protection policy; procedures
          addressing physical access authorizations; physical access
          control logs or records; list of positions/roles and
          corresponding physical access authorizations; system entry
          and exit points; system security plan; other relevant
          documents or records
      - method: interview
        statement: >-
          Organizational personnel with physical access
          authorization responsibilities; organizational personnel
          with physical access to system facility; organizational
          personnel with information security responsibilities
      - method: test
        statement: >-
          Organizational processes for physical access
          authorizations; mechanisms supporting and/or implementing
          physical access authorizations
    statement: >-
      physical access to the facility where the system resides is
      authorized based on position or role.
statement: >-
  Authorize physical access to the facility where the system resides
  based on position or role.

parameters:
  pm_18_odp:
    label: frequency
parts:
  - id: a
    statement: >-
      Develop and disseminate an organization-wide privacy program
      plan that provides an overview of the agency’s privacy
      program, and:
  - id: a.1
    statement: >-
      Includes a description of the structure of the privacy program
      and the resources dedicated to the privacy program;
  - id: a.2
    statement: >-
      Provides an overview of the requirements for the privacy
      program and a description of the privacy program management
      controls and common controls in place or planned for meeting
      those requirements;
  - id: a.3
    statement: >-
      Includes the role of the senior agency official for privacy
      and the identification and assignment of roles of other
      privacy officials and staff and their responsibilities;
  - id: a.4
    statement: >-
      Describes management commitment, compliance, and the strategic
      goals and objectives of the privacy program;
  - id: a.5
    statement: >-
      Reflects coordination among organizational entities
      responsible for the different aspects of privacy; and
  - id: a.6
    statement: >-
      Is approved by a senior official with responsibility and
      accountability for the privacy risk being incurred to
      organizational operations (including mission, functions,
      image, and reputation), organizational assets, individuals,
      other organizations, and the Nation; and
  - id: b
    statement: >-
      Update the plan {{ pm_18_odp }} and to address changes in
      federal privacy laws and policy and organizational changes and
      problems identified during plan implementation or privacy
      control assessments.

name: Functional Properties of Controls
display_id: "SA-4(1)"
class: enhancement
framework_ref: framework--nist-sp-800-53-r5
objectives:
  - id: "sa-04(01)"
    methods:
      - method: examine
        statement: >-
          System and services acquisition policy; system and
          services acquisition procedures; procedures addressing the
          integration of security and privacy requirements,
          descriptions, and criteria into the acquisition process;
          solicitation documents; acquisition documentation;
          acquisition contracts for the system, system component, or
          system services; system security plan; privacy plan; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with acquisition/contracting
          responsibilities; organizational personnel with
          information security and privacy responsibilities; system
          developers
      - method: test
        statement: >-
          Organizational processes for determining system security
          functional requirements; organizational processes for
          developing acquisition contracts; mechanisms supporting
          and/or implementing acquisitions and the inclusion of
          security and privacy requirements in contracts
    statement: >-
      the developer of the system, system component, or system
      service is required to provide a description of the functional
      properties of the controls to be implemented.
statement: >-
  Require the developer of the system, system component, or system
  service to provide a description of the functional properties of
  the controls to be implemented.

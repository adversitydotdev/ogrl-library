parts:
  - id: a
    statement: >-
      Limit the use of commercially provided information assurance
      and information assurance-enabled information technology
      products to those products that have been successfully
      evaluated against a National Information Assurance partnership
      (NIAP)-approved Protection Profile for a specific technology
      type, if such a profile exists; and
  - id: b
    statement: >-
      Require, if no NIAP-approved Protection Profile exists for a
      specific technology type but a commercially provided
      information technology product relies on cryptographic
      functionality to enforce its security policy, that the
      cryptographic module is FIPS-validated or NSA-approved.

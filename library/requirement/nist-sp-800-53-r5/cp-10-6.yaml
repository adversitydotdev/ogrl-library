  - id: "cp-10(06)"
    methods:
      - method: examine
        statement: >
          Contingency planning policy; procedures addressing system recovery and
          reconstitution; contingency plan; system design documentation; system
          configuration settings and associated documentation; logical access
          credentials; physical access credentials; logical access authorization
          records; physical access authorization records; system security plan; other
          relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with system recovery and reconstitution
          responsibilities; organizational personnel with information security

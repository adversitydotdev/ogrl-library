          procedures; procedures addressing system monitoring tools and techniques;
          continuous monitoring strategy; facility diagram/layout; system design
          documentation; system monitoring tools and techniques documentation;
          locations within the system where monitoring devices are deployed; system
          configuration settings and associated documentation; system security plan;
          other relevant documents or records
      - method: interview
        statement: >

  - id: a-1
    methods:
      - method: examine
        statement: >-
          Supply chain risk management policy; supply chain risk
          management procedures; supply chain risk management plan;
          system and services acquisition policy; system and
          services acquisition procedures; procedures addressing
          supply chain protection; procedures for protecting the
          supply chain risk management plan from unauthorized
          disclosure and modification; system development life cycle
          procedures; procedures addressing the integration of
          information security and privacy requirements into the
          acquisition process; acquisition documentation; service
          level agreements; acquisition contracts for the system,
          system component, or system service; list of supply chain
          threats; list of safeguards to be taken against supply
          chain threats; system life cycle documentation;
          inter-organizational agreements and procedures; system
          security plan; privacy plan; privacy program plan; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with acquisition
          responsibilities; organizational personnel with
          information security and privacy responsibilities;
          organizational personnel with supply chain risk management
          responsibilities
      - method: test
        statement: >-
          Organizational processes for defining and documenting the
          system development life cycle (SDLC); organizational
          processes for identifying SDLC roles and responsibilities;
          organizational processes for integrating supply chain risk
          management into the SDLC; mechanisms supporting and/or
          implementing the SDLC
    statement: a plan for managing supply chain risks is developed;

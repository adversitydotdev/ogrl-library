objectives:
  - id: a
    methods:
      - method: examine
        statement: >-
          Configuration management policy; procedures addressing
          least functionality in the system; configuration
          management plan; system security plan; system design
          documentation; system configuration settings and
          associated documentation; list or record of binary or
          machine-executable code; system component inventory;
          common secure configuration checklists; system audit
          records; system security plan; other relevant documents or
          records
      - method: interview
        statement: >-
          Organizational personnel with responsibilities for
          determining mission and operational requirements;
          authorizing official for the system; organizational
          personnel with information security responsibilities;
          organizational personnel with software management
          responsibilities; system/network administrators
      - method: test
        statement: >-
          Organizational process for approving execution of binary
          or machine-executable code; mechanisms supporting and/or
          implementing the prohibition of binary or
          machine-executable code
    statement: >-
      the use of binary or machine-executable code is prohibited
      when it originates from sources with limited or no warranty or
      without the provision of source code;

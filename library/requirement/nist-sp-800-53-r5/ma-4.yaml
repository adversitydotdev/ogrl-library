parts:
  - id: a
    statement: Approve and monitor nonlocal maintenance and diagnostic activities;
  - id: b
    statement: >
      Allow the use of nonlocal maintenance and diagnostic tools only as
      consistent with organizational policy and documented in the security plan
      for the system;
  - id: c
    statement: >
      Employ strong authentication in the establishment of nonlocal maintenance
      and diagnostic sessions;
  - id: d
    statement: Maintain records for nonlocal maintenance and diagnostic activities; and
  - id: e
    statement: >
      Terminate session and network connections when nonlocal maintenance is
      completed.

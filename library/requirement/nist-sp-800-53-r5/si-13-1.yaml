objectives:
  - id: "si-13(01)"
    methods:
      - method: examine
        statement: >
          System and information integrity policy; system and
          information integrity procedures; procedures addressing
          predictable failure prevention; system design
          documentation; system configuration settings and
          associated documentation; system audit records; system
          security plan; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel responsible for MTTF activities;
          organizational personnel with information security
          responsibilities; system/network administrators;
          organizational personnel with contingency planning
          responsibilities
      - method: test
        statement: >
          Organizational processes for managing MTTF; automated
          mechanisms supporting and/or implementing the transfer of
          component responsibilities to substitute components
    statement: >

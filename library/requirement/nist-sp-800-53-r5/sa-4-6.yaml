          organizational personnel with information security responsibilities
      - method: test
        statement: >
          Organizational processes for selecting and employing evaluated and/or
          validated information assurance products and services that compose an
          NSA-approved solution to protect classified information
    statement: >
      these products have been evaluated and/or validated by NSA or in accordance

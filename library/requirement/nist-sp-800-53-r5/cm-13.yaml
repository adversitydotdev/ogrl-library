objectives:
  - id: _obj
    methods:
      - method: examine
        statement: >-
          Configuration management policy; procedures for
          identification and documentation of information location;
          procedures for mapping data actions; configuration
          management plan; system security plan; privacy plan;
          system design documentation; PII inventory documentation;
          data mapping documentation; change control records; system
          component inventory; other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with responsibilities for
          managing information location; organizational personnel
          responsible for data action mapping; organizational
          personnel with information security and privacy
          responsibilities; system/network administrators; system
          developers
      - method: test
        statement: >-
          Organizational processes governing information location;
          mechanisms supporting or implementing data action mapping
    statement: >-
      a map of system data actions is developed and documented.
statement: Develop and document a map of system data actions.

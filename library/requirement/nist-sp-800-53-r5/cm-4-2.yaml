  - id: "cm-04(02).cm-04(02)[01]"
    methods:
      - method: examine
        statement: >-
          Configuration management policy; procedures addressing
          security impact analyses for changes to the system;
          procedures addressing privacy impact analyses for changes
          to the system; privacy risk assessment documentation;
          configuration management plan; security and privacy impact
          analysis documentation; privacy impact assessment;
          analysis tools and associated outputs; change control
          records; control assessment results; system audit records;
          system component inventory; system security plan; privacy
          plan; other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with responsibility for
          conducting security and privacy impact analyses;
          organizational personnel with information security and
          privacy responsibilities; system/network administrators;
          security and privacy assessors
      - method: test
        statement: >-
          Organizational processes for security and privacy impact
          analyses; mechanisms supporting and/or implementing
          security and privacy impact analyses of changes
    statement: >-
      the impacted controls are implemented correctly with regard to
      meeting the security requirements for the system after system
      changes;

objectives:
  - id: "si-04(16)"
    methods:
      - method: examine
        statement: >-
          System and information integrity policy; system and
          information integrity procedures; procedures addressing
          system monitoring tools and techniques; system design
          documentation; system monitoring tools and techniques
          documentation; system configuration settings and
          associated documentation; event correlation logs or
          records; system audit records; system security plan; other
          relevant documents or records
      - method: interview
        statement: >-
          System/network administrators; organizational personnel
          with information security responsibilities; organizational
          personnel installing, configuring, and/or maintaining the
          system; organizational personnel responsible for
          monitoring the system; organizational personnel
          responsible for the intrusion detection system
      - method: test
        statement: >-
          Organizational processes for intrusion detection and
          system monitoring; mechanisms supporting and/or
          implementing intrusion detection and system monitoring
          capabilities; mechanisms supporting and/or implementing
          the correlation of information from monitoring tools
    statement: >-
      information from monitoring tools and mechanisms employed
      throughout the system is correlated.

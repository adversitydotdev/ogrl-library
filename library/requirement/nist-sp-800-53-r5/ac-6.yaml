objectives:
  - id: ac-06
    methods:
      - method: examine
        statement: >
          Access control policy; procedures addressing least
          privilege; list of assigned access authorizations (user
          privileges); system configuration settings and associated
          documentation; system audit records; system security plan;
          other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with responsibilities for
          defining least privileges necessary to accomplish
          specified tasks; organizational personnel with information
          security responsibilities; system/network administrators
      - method: test
        statement: Mechanisms implementing least privilege functions
    statement: >
      the principle of least privilege is employed, allowing only
      authorized accesses for users (or processes acting on behalf
      of users) that are necessary to accomplish assigned
      organizational tasks.
statement: >
  Employ the principle of least privilege, allowing only authorized
  accesses for users (or processes acting on behalf of users) that
  are necessary to accomplish assigned organizational tasks.

parts:
  - id: a
    statement: >-
      Eliminate unnecessary collection, maintenance, and use of
      Social Security numbers, and explore alternatives to their use
      as a personal identifier;
  - id: b
    statement: >-
      Do not deny any individual any right, benefit, or privilege
      provided by law because of such individual’s refusal to
      disclose his or her Social Security number; and
  - id: c
    statement: >-
      Inform any individual who is asked to disclose his or her
      Social Security number whether that disclosure is mandatory or
      voluntary, by what statutory or other authority such number is
      solicited, and what uses will be made of it.

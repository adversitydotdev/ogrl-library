    methods:
      - method: examine
        statement: >
          Access control policy; procedures for preventing and detecting data mining;
          policies and procedures addressing authorized data mining techniques;
          procedures addressing protection of data storage objects against data
          mining; system design documentation; system configuration settings and
          associated documentation; system audit logs; system audit records;
          procedures addressing differential privacy techniques; notifications of
          atypical database queries or accesses; documentation or reports of insider
          threat program; system security plan; privacy plan; other relevant documents
          or records
      - method: interview
        statement: >
          Organizational personnel with responsibilities for implementing data mining
          detection and prevention techniques for data storage objects; legal counsel;
          organizational personnel with information security and privacy
          responsibilities; system developers
      - method: test
        statement: Mechanisms implementing data mining prevention and detection
    statement: >
      {{ ac_23_odp_01 }} are employed for {{ ac_23_odp_02 }} to detect and protect

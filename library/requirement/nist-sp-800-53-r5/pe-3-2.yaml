objectives:
  - id: "pe-03(02)"
    methods:
      - method: examine
        statement: >-
          Physical and environmental protection policy; procedures
          addressing physical access control; physical access
          control logs or records; records of security checks;
          security audit reports; security inspection reports;
          facility layout documentation; system entry and exit
          points; system security plan; other relevant documents or
          records
      - method: interview
        statement: >-
          Organizational personnel with physical access control
          responsibilities; organizational personnel with
          information security responsibilities
      - method: test
        statement: >-
          Organizational processes for physical access control to
          the facility and/or system; mechanisms supporting and/or
          implementing physical access control for the facility or
          system; mechanisms supporting and/or implementing security
          checks for the unauthorized exfiltration of information
    statement: >-
      security checks are performed {{ pe_03_02_odp }} at the
      physical perimeter of the facility or system for exfiltration
      of information or removal of system components.

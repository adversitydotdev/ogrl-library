objectives:
  - id: "sa-10(05)"
    methods:
      - method: examine
        statement: >-
          System and services acquisition policy; procedures
          addressing system developer configuration management;
          solicitation documentation; acquisition documentation;
          service level agreements; acquisition contracts for the

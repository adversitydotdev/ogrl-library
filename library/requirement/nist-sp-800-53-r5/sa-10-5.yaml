          code); system security plan; other relevant documents or
          records
      - method: interview
        statement: >-
          Organizational personnel with system and service
          acquisition responsibilities; organizational personnel
          with information security responsibilities; organizational
          personnel with configuration management responsibilities;
          system developers
      - method: test
        statement: >-
          Organizational processes for monitoring developer
          configuration management; mechanisms supporting and/or
          implementing the monitoring of developer configuration
          management
    statement: >-
      the developer of the system, system component, or system
      service is required to maintain the integrity of the mapping
      between the master build data describing the current version
      of security-relevant hardware, software, and firmware and the

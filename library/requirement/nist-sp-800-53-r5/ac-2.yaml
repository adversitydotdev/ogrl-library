          employees; access authorization records; account
          management compliance reviews; system monitoring records;
          system audit records; system security plan; privacy plan;
          other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with account management
          responsibilities; system/network administrators;
          organizational personnel with information security with
          information security and privacy responsibilities
      - method: test
        statement: >-
          Organizational processes for account management on the
          system; mechanisms for implementing account management
    statement: >-
      account types allowed for use within the system are defined
      and documented;

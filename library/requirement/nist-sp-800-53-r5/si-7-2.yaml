objectives:
  - id: "si-07(02)"
    methods:
      - method: examine
        statement: >-
          System and information integrity policy; system and
          information integrity procedures; procedures addressing
          software, firmware, and information integrity; personally
          identifiable information processing policy; system design
          documentation; system configuration settings and
          associated documentation; integrity verification tools and
          associated documentation; records of integrity scans;
          automated tools supporting alerts and notifications for
          integrity discrepancies; notifications provided upon
          discovering discrepancies during integrity verifications;
          system audit records; system security plan; privacy plan;
          other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel responsible for software,
          firmware, and/or information integrity; organizational
          personnel with information security and privacy
          responsibilities; system administrators; software
          developers
      - method: test
        statement: >-
          Software, firmware, and information integrity verification
          tools; mechanisms providing integrity discrepancy
          notifications
    statement: >-
      automated tools that provide notification to
      {{ si_07_02_odp }} upon discovering discrepancies during
      integrity verification are employed.
parameters:
  si_07_02_odp:
    label: personnel or roles
statement: >-
  Employ automated tools that provide notification to
  {{ si_07_02_odp }} upon discovering discrepancies during integrity
  verification.

objectives:
  - id: a-1
    methods:
      - method: examine
        statement: >-
          Privacy program plan; policies and procedures for the
          minimization of personally identifiable information used
          in testing, training, and research; documentation
          supporting policy implementation (e.g., templates for
          testing, training, and research; privacy threshold
          analysis; privacy risk assessment); data sets used for
          testing, training, and research
      - method: interview
        statement: >-
          Organizational personnel with privacy program
          responsibilities; organizational personnel with privacy
          responsibilities; system developers; personnel with IRB
          responsibilities
      - method: test
        statement: >-
          Organizational processes for data quality and personally
          identifiable information management; mechanisms supporting
          data quality management and personally identifiable
          information management to minimize the use of personally
          identifiable information
    statement: >-
      policies that address the use of personally identifiable
      information for internal testing are developed and documented;

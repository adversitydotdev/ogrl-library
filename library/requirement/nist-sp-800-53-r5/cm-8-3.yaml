objectives:
  - id: a-1
    methods:
      - method: examine
        statement: >
          Configuration management policy; procedures addressing
          system component inventory; configuration management plan;
          system design documentation; system security plan; system
          component inventory; change control records;
          alerts/notifications of unauthorized components within the
          system; system monitoring records; system maintenance
          records; system audit records; system security plan; other
          relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with component inventory
          management responsibilities; organizational personnel with
          responsibilities for managing the automated mechanisms
          implementing unauthorized system component detection;
          organizational personnel with information security
          responsibilities; system/network administrators; system
          developers
      - method: test
        statement: >
          Organizational processes for detection of unauthorized
          system components; organizational processes for taking
          action when unauthorized system components are detected;
          automated mechanisms supporting and/or implementing the
          detection of unauthorized system components; automated
          mechanisms supporting and/or implementing actions taken
          when unauthorized system components are detected
    statement: >
      the presence of unauthorized hardware within the system is
      detected using {{ cm_08_03_odp_01 }} {{ cm_08_03_odp_04 }};

parts:
  - id: a
    statement: >-
      Implement a process for ensuring that organizational plans for
      conducting security and privacy testing, training, and
      monitoring activities associated with organizational systems:
  - id: a.1
    statement: Are developed and maintained; and
  - id: a.2
    statement: Continue to be executed; and
  - id: b
    statement: >-
      Review testing, training, and monitoring plans for consistency
      with the organizational risk management strategy and
      organization-wide priorities for risk response actions.

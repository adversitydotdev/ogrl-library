          information system; alarm service-level agreements; test
          records of fire suppression and detection devices/systems;
          fire suppression and detection devices/systems
          documentation; alerts/notifications of fire events; system
          security plan; other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with responsibilities for fire

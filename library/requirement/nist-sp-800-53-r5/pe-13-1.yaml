          responsibilities
      - method: test
        statement: >-
          Mechanisms supporting and/or implementing fire detection
          devices/systems; activation of fire detection
          devices/systems (simulated); automated notifications
    statement: >-
      fire detection systems that activate automatically are
      employed in the event of a fire;

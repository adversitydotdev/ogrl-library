objectives:
  - id: "ac-16(04).ac-16(04)[01]"
    methods:
      - method: examine
        statement: >
          Access control policy; procedures addressing the association of security and
          privacy attributes to information; system design documentation; system
          configuration settings and associated documentation; list of users
          authorized to associate security and privacy attributes to information;
          system prompts for privileged users to select security and privacy
          attributes to be associated with information objects; system audit records;
          system security plan; privacy plan; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with responsibilities for associating security and
          privacy attributes to information; organizational personnel with information
          security and privacy responsibilities; system developers
      - method: test
        statement: >
          Mechanisms supporting user associations of security and privacy attributes
          to information
    statement: >
      authorized individuals (or processes acting on behalf of individuals) are
      provided with the capability to associate {{ ac_16_04_odp_01 }} with
      {{ ac_16_04_odp_05 }};

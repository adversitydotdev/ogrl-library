parts:
  - id: a
    statement: >-
      Select the appropriate assessor or assessment team for the
      type of assessment to be conducted;
  - id: b
    statement: >-
      Develop a control assessment plan that describes the scope of
      the assessment including:
  - id: b.1
    statement: Controls and control enhancements under assessment;
  - id: b.2
    statement: >-
      Assessment procedures to be used to determine control
      effectiveness; and
  - id: b.3
    statement: >-
      Assessment environment, assessment team, and assessment roles
      and responsibilities;
  - id: c
    statement: >-
      Ensure the control assessment plan is reviewed and approved by
      the authorizing official or designated representative prior to
      conducting the assessment;
  - id: d
    statement: >-
      Assess the controls in the system and its environment of
      operation {{ ca_02_odp_01 }} to determine the extent to which
      the controls are implemented correctly, operating as intended,
      and producing the desired outcome with respect to meeting
      established security and privacy requirements;
  - id: e
    statement: >-
      Produce a control assessment report that document the results
      of the assessment; and
  - id: f
    statement: >-
      Provide the results of the control assessment to
      {{ ca_02_odp_02 }}.

objectives:
  - id: "sa-04(08)"
    methods:
      - method: examine
        statement: >-
          System and services acquisition policy; procedures
          addressing developer continuous monitoring plans;
          procedures addressing the integration of security
          requirements, descriptions, and criteria into the
          acquisition process; developer continuous monitoring
          plans; security assessment plans; acquisition contracts
          for the system, system component, or system service;
          acquisition documentation; solicitation documentation;
          service level agreements; system security plan; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with acquisition/contracting
          responsibilities; organizational personnel with the
          responsibility for determining system security
          requirements; system developers; organizational personnel
          with information security responsibilities
      - method: test
        statement: >-
          Vendor processes for continuous monitoring; mechanisms
          supporting and/or implementing developer continuous
          monitoring
    statement: >-
      the developer of the system, system component, or system
      service is required to produce a plan for the continuous
      monitoring of control effectiveness that is consistent with
      the continuous monitoring program of the organization.
statement: >-
  Require the developer of the system, system component, or system
  service to produce a plan for continuous monitoring of control

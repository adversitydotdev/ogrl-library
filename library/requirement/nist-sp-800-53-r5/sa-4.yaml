objectives:
  - id: a-1
    methods:
      - method: examine
        statement: >
          System and services acquisition policy; system and services acquisition
          procedures; procedures addressing the integration of information security
          and privacy and supply chain risk management into the acquisition process;
          configuration management plan; acquisition contracts for the system, system
          component, or system service; system design documentation; system security
          plan; supply chain risk management plan; privacy plan; other relevant
          documents or records
      - method: interview
        statement: >
          Organizational personnel with acquisition/contracting responsibilities;
          organizational personnel with information security and privacy
          responsibilities; system/network administrators; organizational personnel
          with supply chain risk management responsibilities
      - method: test
        statement: >
          Organizational processes for determining system security and privacy
          functional, strength, and assurance requirements; organizational processes
          for developing acquisition contracts; mechanisms supporting and/or
          implementing acquisitions and the inclusion of security and privacy
          requirements in contracts
    statement: >
      security functional requirements, descriptions, and criteria are included
      explicitly or by reference using {{ sa_04_odp_01 }} in the acquisition
      contract for the system, system component, or system service;

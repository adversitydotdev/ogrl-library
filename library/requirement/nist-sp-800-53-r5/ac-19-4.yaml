parameters:
  ac_19_04_odp_01:
    label: security officials
  ac_19_04_odp_02:
    label: security policies
parts:
  - id: a
    statement: >-
      Prohibit the use of unclassified mobile devices in facilities
      containing systems processing, storing, or transmitting
      classified information unless specifically permitted by the
      authorizing official; and
  - id: b
    statement: >-
      Enforce the following restrictions on individuals permitted by
      the authorizing official to use unclassified mobile devices in
      facilities containing systems processing, storing, or
      transmitting classified information:
  - id: b.1
    statement: >-
      Connection of unclassified mobile devices to classified
      systems is prohibited;
  - id: b.2
    statement: >-
      Connection of unclassified mobile devices to unclassified
      systems requires approval from the authorizing official;
  - id: b.3
    statement: >-
      Use of internal or external modems or wireless interfaces
      within the unclassified mobile devices is prohibited; and
  - id: b.4
    statement: >-
      Unclassified mobile devices and the information stored on
      those devices are subject to random reviews and inspections by
      {{ ac_19_04_odp_01 }} , and if classified information is
      found, the incident handling policy is followed.
  - id: c
    statement: >-
      Restrict the connection of classified mobile devices to
      classified systems in accordance with {{ ac_19_04_odp_02 }}.

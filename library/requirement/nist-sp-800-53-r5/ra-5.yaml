parts:
  - id: a
    statement: >
      Monitor and scan for vulnerabilities in the system and hosted
      applications {{ ra_5_prm_1 }} and when new vulnerabilities
      potentially affecting the system are identified and reported;
  - id: b
    statement: >
      Employ vulnerability monitoring tools and techniques that
      facilitate interoperability among tools and automate parts of
      the vulnerability management process by using standards for:
  - id: b.1
    statement: >-
      Enumerating platforms, software flaws, and improper
      configurations;
  - id: b.2
    statement: Formatting checklists and test procedures; and
  - id: b.3
    statement: Measuring vulnerability impact;
  - id: c
    statement: >-
      Analyze vulnerability scan reports and results from
      vulnerability monitoring;
  - id: d
    statement: >
      Remediate legitimate vulnerabilities {{ ra_05_odp_03 }} in
      accordance with an organizational assessment of risk;
  - id: e
    statement: >
      Share information obtained from the vulnerability monitoring
      process and control assessments with {{ ra_05_odp_04 }} to
      help eliminate similar vulnerabilities in other systems; and
  - id: f
    statement: >
      Employ vulnerability monitoring tools that include the
      capability to readily update the vulnerabilities to be
      scanned.

objectives:
  - id: a-1
    methods:
      - method: examine
        statement: >-
          System and information integrity policy; system and
          information integrity procedures; procedures addressing
          flaw remediation; procedures addressing configuration
          management; list of flaws and vulnerabilities potentially
          affecting the system; list of recent security flaw
          remediation actions performed on the system (e.g., list of
          installed patches, service packs, hot fixes, and other
          software updates to correct system flaws); test results
          from the installation of software and firmware updates to
          correct system flaws; installation/change control records
          for security-relevant software and firmware updates;
          system security plan; privacy plan; other relevant
          documents or records
      - method: interview
        statement: >-
          System/network administrators; organizational personnel
          with information security and privacy responsibilities;
          organizational personnel responsible for installing,
          configuring, and/or maintaining the system; organizational
          personnel responsible for flaw remediation; organizational
          personnel with configuration management responsibilities
      - method: test
        statement: >-
          Organizational processes for identifying, reporting, and
          correcting system flaws; organizational process for
          installing software and firmware updates; mechanisms
          supporting and/or implementing the reporting and
          correcting of system flaws; mechanisms supporting and/or
          implementing testing software and firmware updates
    statement: system flaws are identified;

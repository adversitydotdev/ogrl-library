  - id: a
    statement: >
      Monitor and control communications at the external managed
      interfaces to the system and at key internal managed
      interfaces within the system;
  - id: b
    statement: >
      Implement subnetworks for publicly accessible system
      components that are {{ sc_07_odp }} separated from internal
      organizational networks; and

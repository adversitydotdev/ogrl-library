parts:
  - id: a
    statement: >
      Develop an organization-wide strategy for managing supply chain risks
      associated with the development, acquisition, maintenance, and disposal of
      systems, system components, and system services;
  - id: b
    statement: >
      Implement the supply chain risk management strategy consistently across the
      organization; and
  - id: c
    statement: >
      Review and update the supply chain risk management strategy on
      {{ pm_30_odp }} or as required, to address organizational changes.

objectives:
  - id: "au-04(01)"
    methods:
      - method: examine
        statement: >-
          Audit and accountability policy; system security plan;
          privacy plan; procedures addressing audit storage
          capacity; procedures addressing transfer of system audit
          records to secondary or alternate systems; system design
          documentation; system configuration settings and
          associated documentation; logs of audit record transfers
          to secondary or alternate systems; system audit records
          transferred to secondary or alternate systems; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with audit storage capacity
          planning responsibilities; organizational personnel with
          information security and privacy responsibilities;
          system/network administrators
      - method: test
        statement: >-
          Mechanisms supporting the transfer of audit records onto a
          different system
    statement: >-
      audit logs are transferred {{ au_04_01_odp }} to a different
      system, system component, or media other than the system or
      system component conducting the logging.

parts:
  - id: a
    statement: >-
      Ensures that the public has access to information about
      organizational privacy activities and can communicate with its
      senior agency official for privacy;
  - id: b
    statement: >-
      Ensures that organizational privacy practices and reports are
      publicly available; and

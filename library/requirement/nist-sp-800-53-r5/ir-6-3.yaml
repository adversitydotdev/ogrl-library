objectives:
  - id: "ir-06(03)"
    methods:
      - method: examine
        statement: >
          Incident response policy; procedures addressing supply
          chain coordination and supply chain risk information
          sharing with the Federal Acquisition Security Council;
          acquisition policy; acquisition contracts; service-level
          agreements; incident response plan; supply chain risk
          management plan; system security plan; plans of other
          organizations involved in supply chain activities; other
          relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with incident reporting
          responsibilities; organizational personnel with
          information security responsibilities; organizational
          personnel with supply chain risk management
          responsibilities; organization personnel with acquisition
          responsibilities
      - method: test
        statement: >
          Organizational processes for incident reporting;
          organizational processes for supply chain risk information
          sharing; mechanisms supporting and/or implementing the
          reporting of incident information involved in the supply
          chain
    statement: >
      incident information is provided to the provider of the
      product or service and other organizations involved in the
      supply chain or supply chain governance for systems or system
      components related to the incident.
statement: >
  Provide incident information to the provider of the product or
  service and other organizations involved in the supply chain or
  supply chain governance for systems or system components related
  to the incident.

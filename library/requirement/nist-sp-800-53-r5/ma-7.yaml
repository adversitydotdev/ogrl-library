      - method: test
        statement: >-
          Organizational processes for managing field maintenance;
          mechanisms implementing, supporting, and/or managing field
          maintenance; mechanisms for strong authentication of field
          maintenance diagnostic sessions; mechanisms for
          terminating field maintenance sessions and network
          connections
    statement: >-
      field maintenance on {{ ma_07_odp_01 }} are restricted or
      prohibited to {{ ma_07_odp_02 }}.

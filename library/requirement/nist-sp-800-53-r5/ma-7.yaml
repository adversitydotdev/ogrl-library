objectives:
  - id: ma-07
    methods:
      - method: examine
        statement: >-
          Maintenance policy; procedures addressing field
          maintenance; system design documentation; system
          configuration settings and associated documentation;
          maintenance records; diagnostic records; system security
          plan; other relevant documents or records.
      - method: interview
        statement: >-
          Organizational personnel with system maintenance
          responsibilities; organizational personnel with
          information security responsibilities; system/network

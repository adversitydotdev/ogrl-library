          system component inventory; system security plan; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with responsibilities for
          verifying digitally signed certificates for software and
          firmware component installation; organizational personnel
          with information security responsibilities; system/network
          administrators; system developers
      - method: test
        statement: >-
          Organizational processes governing information location;
          mechanisms enforcing policies and methods for governing
          information location; automated tools supporting or
          implementing digitally signatures for software and
          firmware components; automated tools supporting or
          implementing verification of digital signatures for
          software and firmware component installation
    statement: >-
      the installation of {{ cm_14_odp_01 }} is prevented unless it
      is verified that the software has been digitally signed using
      a certificate recognized and approved by the organization;

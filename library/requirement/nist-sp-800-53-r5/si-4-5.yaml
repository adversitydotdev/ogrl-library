objectives:
  - id: "si-04(05)"
    methods:
      - method: examine
        statement: >
          System and information integrity policy; system and information integrity
          procedures; procedures addressing system monitoring tools and techniques;
          system monitoring tools and techniques documentation; system configuration
          settings and associated documentation; list of personnel selected to receive
          alerts; documentation of alerts generated based on compromise indicators;
          system audit records; system security plan; privacy plan; other relevant
          documents or records
      - method: interview
        statement: >
          System/network administrators; organizational personnel with information
          security and privacy responsibilities; system developers; organizational
          personnel installing, configuring, and/or maintaining the system;
          organizational personnel responsible for monitoring the system;
          organizational personnel on the system alert notification list;
          organizational personnel responsible for the intrusion detection system
      - method: test
        statement: >
          Organizational processes for intrusion detection and system monitoring;
          mechanisms supporting and/or implementing intrusion detection and system
          monitoring capabilities; mechanisms supporting and/or implementing alerts
          for compromise indicators
    statement: >
      {{ si_04_05_odp_01 }} are alerted when system-generated
      {{ si_04_05_odp_02 }} occur.

  - id: "[01]"
    methods:
      - method: examine
        statement: >-
          Identification and authentication policy; procedures
          addressing user identification and authentication; system
          security plan, system design documentation; system
          configuration settings and associated documentation;
          system audit records; list of system accounts; other
          relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with system operations
          responsibilities; organizational personnel with
          information security responsibilities; system/network

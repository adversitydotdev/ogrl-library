      - method: interview
        statement: >-
          Organizational personnel with the responsibility for
          determining system security and privacy requirements;
          organizational personnel with system specification,
          design, development, implementation, and modification
          responsibilities; system developers; organizational
          personnel with information security responsibilities;
          organizational personnel with supply chain risk management
          responsibilities
      - method: test
        statement: >-
          Organizational processes for applying the security design
          principle of trusted components in system specification,
          design, development, implementation, and modification;
          mechanisms supporting the application of the security
          design principle of trusted components in system
          specification, design, development, implementation, and
          modification
    statement: >-
      {{ sa_08_09_odp }} implement the security design principle of
      trusted components.

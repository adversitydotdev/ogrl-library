objectives:
  - id: "sa-08(09)"
    methods:
      - method: examine
        statement: >-
          Supply chain risk management plan; system and services
          acquisition policy; procedures addressing the security
          design principle of trusted components used in the
          specification, design, development, implementation, and
          modification of the system; system design documentation;
          security, supply chain risk management, and privacy
          requirements and specifications for the system; system
          security and privacy architecture; procedures for

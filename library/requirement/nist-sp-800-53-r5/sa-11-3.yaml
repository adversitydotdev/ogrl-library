objectives:
  - id: a-1
    methods:
      - method: examine
        statement: >
          System and services acquisition policy; system and
          services acquisition procedures; procedures addressing
          system developer security testing; solicitation
          documentation; acquisition documentation; service level
          agreements; acquisition contracts for the system, system
          component, or system service; independent verification and
          validation reports; security and privacy assessment plans;
          results of security and privacy assessments for the
          system, system component, or system service; system
          security plan; privacy plan; privacy program plan; other
          relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with system and service
          acquisition responsibilities; organizational personnel
          with information security and privacy responsibilities;
          organizational personnel with developer security testing
          responsibilities; system developers; independent
          verification agent
      - method: test
        statement: >
          Organizational processes for monitoring developer security
          testing and evaluation; mechanisms supporting and/or
          implementing the monitoring of developer security testing
          and evaluation
    statement: >
      an independent agent is required to satisfy {{ sa_11_03_odp }}
      to verify the correct implementation of the developer security
      assessment plan and the evidence produced during testing and
      evaluation;

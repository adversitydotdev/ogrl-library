objectives:
  - id: "ac-21(01)"
    methods:
      - method: examine
        statement: >
          Access control policy; procedures addressing user-based
          collaboration and information sharing (including
          restrictions); system design documentation; system
          configuration settings and associated documentation;
          system-generated list of users authorized to make
          information-sharing/collaboration decisions;
          system-generated list of sharing partners and access
          authorizations; system-generated list of access
          restrictions regarding information to be shared; system
          security plan; other relevant documents or records
      - method: interview
        statement: >
          System/network administrators; organizational personnel
          with information security responsibilities; system
          developers
      - method: test
        statement: >
          Automated mechanisms implementing access authorizations
          supporting information-sharing/user collaboration
          decisions
    statement: >
      {{ ac_21_01_odp }} are employed to enforce information-sharing
      decisions by authorized users based on access authorizations
      of sharing partners and access restrictions on information to
      be shared.

objectives:
  - id: ia-09
    methods:
      - method: examine
        statement: >
          Identification and authentication policy; procedures addressing service
          identification and authentication; system security plan; system design
          documentation; security safeguards used to identify and authenticate system
          services; system configuration settings and associated documentation; system
          audit records; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with system operations responsibilities;
          organizational personnel with information security responsibilities;
          system/network administrators; system developers; organizational personnel
          with identification and authentication responsibilities
      - method: test
        statement: >
          Security safeguards implementing service identification and authentication
          capabilities
    statement: >

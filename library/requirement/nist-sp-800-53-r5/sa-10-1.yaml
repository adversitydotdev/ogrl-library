name: Software and Firmware Integrity Verification
display_id: "SA-10(1)"
class: enhancement
framework_ref: framework--nist-sp-800-53-r5
objectives:
  - id: "sa-10(01)"
    methods:
      - method: examine
        statement: >
          System and services acquisition policy; procedures addressing system
          developer configuration management; solicitation documentation; acquisition
          documentation; service level agreements; acquisition contracts for the
          system, system component, or system service; system developer configuration
          management plan; software and firmware integrity verification records;
          system change authorization records; change control records; configuration
          management records; system security plan; supply chain risk management plan;
          other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with system and service acquisition
          responsibilities; organizational personnel with information security
          responsibilities; organizational personnel with configuration management
          responsibilities; system developers; organizational personnel with supply
          chain risk management responsibilities
      - method: test
        statement: >
          Organizational processes for monitoring developer configuration management;
          mechanisms supporting and/or implementing the monitoring of developer
          configuration management
    statement: >
      the developer of the system, system component, or system service is required
      to enable integrity verification of software and firmware components.
statement: >
  Require the developer of the system, system component, or system service to
  enable integrity verification of software and firmware components.

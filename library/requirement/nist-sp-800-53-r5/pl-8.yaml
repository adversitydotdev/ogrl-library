parameters:
  pl_08_odp:
    label: frequency
parts:
  - id: a
    statement: >-
      Develop security and privacy architectures for the system
      that:
  - id: a.1
    statement: >-
      Describe the requirements and approach to be taken for
      protecting the confidentiality, integrity, and availability of
      organizational information;
  - id: a.2
    statement: >-
      Describe the requirements and approach to be taken for
      processing personally identifiable information to minimize
      privacy risk to individuals;
  - id: a.3
    statement: >-
      Describe how the architectures are integrated into and support
      the enterprise architecture; and
  - id: a.4
    statement: >-
      Describe any assumptions about, and dependencies on, external
      systems and services;
  - id: b
    statement: >-
      Review and update the architectures {{ pl_08_odp }} to reflect
      changes in the enterprise architecture; and
  - id: c
    statement: >-
      Reflect planned architecture changes in security and privacy
      plans, Concept of Operations (CONOPS), criticality analysis,
      organizational procedures, and procurements and acquisitions.

objectives:
  - id: "sa-09(08)"
    methods:
      - method: examine
        statement: >-
          System and services acquisition policy; system and
          services acquisition procedures; procedures addressing
          external system services; acquisition contracts for the
          system, system component, or system service; solicitation
          documentation; acquisition documentation; service level
          agreements; procedures addressing determining jurisdiction
          restrictions for processing and storage location;
          information/data and/or system services; organizational
          security requirements or conditions for external
          providers; system security plan; supply chain risk
          management plan; other relevant documents or records
      - method: interview
        statement: >-
          Organizational personnel with system and service
          acquisition responsibilities; organizational personnel
          with information security responsibilities; organization
          personnel with supply chain risk management
          responsibilities; external providers of system services
      - method: test
        statement: >-
          Organizational processes restricting external system
          service providers to process and store information within
          the legal jurisdictional boundary of the United States
    statement: >-
      the geographic location of information processing and data
      storage is restricted to facilities located within the legal
      jurisdictional boundary of the United States.
statement: >-
  Restrict the geographic location of information processing and
  data storage to facilities located within in the legal

parameters:
  pl_02_odp_01:
    label: individuals or groups
  pl_02_odp_02:
    label: personnel or roles
  pl_02_odp_03:
    label: frequency
parts:
  - id: a
    statement: >-
      Develop security and privacy plans for the system that:
  - id: a.1
    statement: >-
      Are consistent with the organization’s enterprise
      architecture;
  - id: a.2
    statement: Explicitly define the constituent system components;
  - id: a.3
    statement: >-
      Describe the operational context of the system in terms of
      mission and business processes;
  - id: a.4
    statement: >-
      Identify the individuals that fulfill system roles and
      responsibilities;
  - id: a.5
    statement: >-
      Identify the information types processed, stored, and
      transmitted by the system;
  - id: a.6
    statement: >-
      Provide the security categorization of the system, including
      supporting rationale;
  - id: a.7
    statement: >-
      Describe any specific threats to the system that are of
      concern to the organization;
  - id: a.8
    statement: >-
      Provide the results of a privacy risk assessment for systems
      processing personally identifiable information;
  - id: a.9
    statement: >-
      Describe the operational environment for the system and any
      dependencies on or connections to other systems or system
      components;
  - id: a.10
    statement: >-
      Provide an overview of the security and privacy requirements
      for the system;
  - id: a.11
    statement: >-
      Identify any relevant control baselines or overlays, if
      applicable;
  - id: a.12
    statement: >-
      Describe the controls in place or planned for meeting the
      security and privacy requirements, including a rationale for
      any tailoring decisions;
  - id: a.13
    statement: >-
      Include risk determinations for security and privacy
      architecture and design decisions;
  - id: a.14
    statement: >-
      Include security- and privacy-related activities affecting the
      system that require planning and coordination with
      {{ pl_02_odp_01 }} ; and
  - id: a.15
    statement: >-
      Are reviewed and approved by the authorizing official or
      designated representative prior to plan implementation.
  - id: b
    statement: >-
      Distribute copies of the plans and communicate subsequent
      changes to the plans to {{ pl_02_odp_02 }};
  - id: c
    statement: "Review the plans {{ pl_02_odp_03 }};"
  - id: d
    statement: >-
      Update the plans to address changes to the system and
      environment of operation or problems identified during plan
      implementation or control assessments; and
  - id: e
    statement: >-
      Protect the plans from unauthorized disclosure and
      modification.

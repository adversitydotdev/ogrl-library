parts:
  - id: a
    statement: >
      Include the resources needed to implement the information
      security and privacy programs in capital planning and
      investment requests and document all exceptions to this
      requirement;
  - id: b
    statement: >
      Prepare documentation required for addressing information
      security and privacy programs in capital planning and
      investment requests in accordance with applicable laws,
      executive orders, directives, policies, regulations,
      standards; and

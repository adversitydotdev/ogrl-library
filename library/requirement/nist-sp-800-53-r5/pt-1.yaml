    statement: "Develop, document, and disseminate to {{ pt_1_prm_1 }}:"
  - id: a.1
    statement: >
      {{ pt_01_odp_03 }} personally identifiable information processing and
      transparency policy that:
  - id: a.1.a
    statement: >
      Addresses purpose, scope, roles, responsibilities, management commitment,
      coordination among organizational entities, and compliance; and
  - id: a.1.b
    statement: >
      Is consistent with applicable laws, executive orders, directives,
      regulations, policies, standards, and guidelines; and
  - id: a.2
    statement: >
      Procedures to facilitate the implementation of the personally identifiable
      information processing and transparency policy and the associated personally
      identifiable information processing and transparency controls;
  - id: b
    statement: >
      Designate an {{ pt_01_odp_04 }} to manage the development, documentation,
      and dissemination of the personally identifiable information processing and
      transparency policy and procedures; and
  - id: c
    statement: >
      Review and update the current personally identifiable information processing
      and transparency:

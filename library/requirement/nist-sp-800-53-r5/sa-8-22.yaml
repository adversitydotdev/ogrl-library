objectives:
  - id: "sa-08(22).sa-08(22)[01]"
    methods:
      - method: examine
        statement: >
          System and services acquisition policy; audit and
          accountability policy; access control policy; procedures
          addressing least privilege; procedures addressing
          auditable events; identification and authentication
          policy; procedures addressing user identification and
          authentication; procedures addressing the security design
          principle of accountability and traceability used in the
          specification, design, development, implementation, and
          modification of the system; system design documentation;
          system audit records; system auditable events; system
          configuration settings and associated documentation;
          security and privacy requirements and specifications for
          the system; system security and privacy architecture;
          system security plan; other relevant documents or records
      - method: interview
        statement: >
          Organizational personnel with the responsibility for
          determining system security and privacy requirements;
          organizational personnel with audit and accountability
          responsibilities; organizational personnel with system
          specification, design, development, implementation, and
          modification responsibilities; system developers;
          organizational personnel with information security
          responsibilities
      - method: test
        statement: >
          Organizational processes for applying the security design
          principle of accountability and traceability in system
          specification, design, development, implementation, and
          modification; mechanisms supporting the application of the
          security design principle of accountability and
          traceability in system specification, design, development,
          implementation, and modification; mechanisms implementing
          information system auditing; mechanisms implementing least
          privilege functions
    statement: >-

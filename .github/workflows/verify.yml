name: Verify Library

on:
  push:
    branches: [main]
  pull_request:

env:
  OGRL_RS_VERSION: v0.2.0

jobs:
  lint:
    name: Lint & format check (ogrl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prebuilt ogrl CLI
        run: |
          base="https://github.com/adversitydotdev/ogrl-rs/releases/download/${OGRL_RS_VERSION}"
          archive="ogrl-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "${archive}" "${base}/${archive}"
          curl -fsSL -o "${archive}.sha256" "${base}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${archive}" -C "$HOME/.local/bin" ogrl
          chmod +x "$HOME/.local/bin/ogrl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f "${archive}" "${archive}.sha256"
      - name: Print ogrl version
        run: ogrl --version
      - name: Lint library (YAML 1.2 + RFC 0001 §7.20)
        run: ogrl lint library --profile library --format sarif > ogrl.sarif || (ogrl lint library --profile library && exit 1)
      - name: Check canonical formatting
        run: ogrl fmt library --check
      - name: Print projection digest
        run: ogrl bundle digest library
